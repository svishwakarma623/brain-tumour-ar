
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brain Tumour AR Viewer</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
    }

    h2 {
      padding: 15px;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      background-color: #ffffff;
    }

    p {
      padding: 10px;
    }
  </style>
</head>

<body>

  <h2>Brain Tumour 3D & AR Viewer</h2>

  <model-viewer
    src="Brain_Tumour_AR_Refined_AR.glb"
    alt="3D brain with WT, TC and ET tumour regions"

    ar
    ar-modes="webxr"
    ar-placement="floor"
    ar-scale="auto"

    camera-controls
    disable-pan
    touch-action="pan-y"

    shadow-intensity="1"
    exposure="1"

    auto-rotate
    auto-rotate-delay="3000"

  >
    <button slot="ar-button">
      View Brain in Your Space
    </button>
  </model-viewer>

  <p>
    Rotate the model with one finger.
    Zoom using pinch gestures.
    Use AR to place it in your environment.
  </p>

</body>
</html>
